# Estimation Tool (PlanIQ) — app-only deployment for the TVSM AI Platform VM.
#
# Ollama is NOT used here: the app falls back to Azure OpenAI when AZURE_OPENAI_*
# are set (see .env.dev), so we run only the FastAPI app — no Ollama sidecar.
#
# Host port 9000 (SmartBrain uses 8000). The app runs with --root-path /planiq so
# it works behind the nginx path prefix  https://smartbrain.tvsmotor.net/planiq/.
# All config (Azure OpenAI keys, SharePoint, SSO, DEV_MODE) loads from .env.dev.
#
# nginx routes to this container:
#   /planiq/          -> :9000/            (SPA / UI)
#   /api/             -> :9000/api/        (all API calls; frontend uses API_BASE='')
#   /health           -> :9000/health      (dev-mode detection)
#   /mpcp-tracker.js  -> :9000/mpcp-tracker.js  (MPCP module script, loaded absolutely)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: estimation-tool-app
    env_file:
      - .env.dev
    command:
      - "uvicorn"
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--root-path"
      - "/planiq"
      - "--workers"
      - "1"
    ports:
      - "9000:8000"   # host 9000 -> container 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

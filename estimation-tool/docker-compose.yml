version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: estimation-tool-ollama
    # Only expose Ollama to localhost — not accessible externally
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: estimation-tool-app
    ports:
      - "8000:8000"
    environment:
      # Ollama connection (sidecar)
      - OLLAMA_HOST=http://ollama:11434
      # SLM config
      - SLM_MODEL_NAME=${SLM_MODEL_NAME:-gemma3:4b}
      - SLM_CONTEXT_WINDOW=${SLM_CONTEXT_WINDOW:-32768}
      # No OpenRouter in prod — all inference stays local
      # SharePoint credentials (provide via .env file or secrets)
      - SHAREPOINT_TENANT_ID=${SHAREPOINT_TENANT_ID:-}
      - SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID:-}
      - SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET:-}
      - SHAREPOINT_SITE_URL=${SHAREPOINT_SITE_URL:-}
      - SHAREPOINT_DRIVE_ID=${SHAREPOINT_DRIVE_ID:-}
      # SSO configuration
      - SSO_ISSUER=${SSO_ISSUER:-}
      - SSO_AUDIENCE=${SSO_AUDIENCE:-}
      - SSO_JWKS_URL=${SSO_JWKS_URL:-}
      - SSO_SECRET=${SSO_SECRET:-dev-secret}
      # Application settings
      - DEV_MODE=${DEV_MODE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_data:

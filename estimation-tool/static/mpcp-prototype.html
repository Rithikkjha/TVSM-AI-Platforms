function render() {

    </div>`;
    let content = '';
    switch(currentView) {
        case 'dashboard': content = renderDashboard(); break;
        case 'mpList': content = renderMPList(); break;
        case 'cpList': content = renderCPList(); break;
        case 'projectList': content = renderProjectList(); break;
        case 'projectDetail': content = renderProjectDetail(); break;
        case 'allProjects': content = renderAllProjects(); break;
    }
    el.innerHTML = buSwitcher + content;
    updateSidebarActive();
}

function updateSidebarActive() {
    document.querySelectorAll('.sidebar .nav-item').forEach(n => n.classList.remove('active'));
    if(currentView === 'allProjects') {
        document.getElementById('nav-allprojects').classList.add('active');
    } else {
        document.getElementById('nav-tracker').classList.add('active');
    }
}

function ragBadge(rag) {
    const labels = {green:'Green',yellow:'Yellow',red:'Red',gray:'Not Started'};
    return `<span class="rag-badge ${rag}"><span class="rag-dot ${rag}"></span> ${labels[rag]||rag}</span>`;
}

function typeBadgeClass(type) {
    if(type==='Fixed_Bid') return 'fixed';
    if(type==='Enhancement') return 'enhancement';
    return 'tandc';
}

function filterAllProjects() {
    const search = (document.getElementById('projectSearch').value || '').toLowerCase();
    const rag = document.getElementById('allRagFilter').value;
    const domain = document.getElementById('allDomainFilter').value;
    const vendor = document.getElementById('allVendorFilter').value;
    const po = document.getElementById('allPOFilter').value;
    const type = document.getElementById('allTypeFilter').value;
    const allProjects = getAllProjects();
    const filtered = allProjects.filter(p => {
        if(search && !p.name.toLowerCase().includes(search)) return false;
        if(rag && p.rag !== rag) return false;
        if(domain && p.domain !== domain) return false;
        if(vendor && p.vendor !== vendor) return false;
        if(po && p.po !== po) return false;
        if(type && p.type !== type) return false;
        return true;
    });
    let rows = filtered.map((p,i) => `<tr onclick="openProjectFromAll('${p.cp}','${p.name}')">
        <td><strong>${p.name}</strong> ${domainPill(p.domain)}</td>
        <td>${p.mp}</td>
        <td>${p.cp}</td>
        <td><span class="type-badge ${typeBadgeClass(p.type)}">${p.type.replace('_',' ')}</span></td>
        <td>${domainPill(p.domain)}</td>
        <td>${p.vendor}</td>
        <td>${p.po}</td>
        <td>${p.stage}</td>
        <td>${ragBadge(p.rag)}</td>
    </tr>`).join('');
    document.querySelector('#allProjectsTable tbody').innerHTML = rows || '<tr class="no-hover"><td colspan="9" style="text-align:center;color:#999;padding:20px">No projects match the filters</td></tr>';
}

function openProjectFromAll(cpCode, projectName) {
    // Set MP and CP context for breadcrumb navigation
    const mpCode = cpCode.split('.')[0];
    selectedMP = MPs.find(m => m.code === mpCode) || {code:mpCode, name:mpCode, theme:'', owner:''};
    const cps = CPsByMP[mpCode] || [];
    selectedCP = cps.find(c => c.code === cpCode) || {code:cpCode, name:cpCode, owner:selectedMP.owner, rag:'green'};
    const projects = ProjectsByCP[cpCode] || [];
    selectedProject = projects.find(p => p.name === projectName) || projectDetail;
    currentView = 'projectDetail';
    currentTab = 'process';
    render();
}

    const stepperHTML = detail.stages.map((s,i) => {
        let circleClass = detail.stageStatus[i];
        let icon = circleClass==='completed'?'✓':circleClass==='current'?'●':'○';
        let connector = i < detail.stages.length-1 ? 
            `<div class="step-connector ${detail.stageStatus[i]==='completed'?'completed':detail.stageStatus[i]==='current'?'current':''}"></div>` : '';
        return `<div class="step-node">
            <div class="step-circle ${circleClass}">${icon}</div>
            <div class="step-label">${s}</div>
            <div class="step-date">${detail.stageDates[i]}</div>
        </div>${connector}`;
    }).join('');

    const ganttBars = detail.milestones.map((m,i) => {
        let leftPlanned = (i * 16) + '%';
        let widthPlanned = '14%';
        let actualBar = '';
        if(m.as !== '—') {
            let cls = m.rag==='red'?'actual-delayed':m.rag==='yellow'?'actual-yellow':'actual-ok';
            actualBar = `<div class="gantt-bar ${cls}" style="left:${parseInt(leftPlanned)+1}%;width:${m.rag==='red'?'16%':'13%'};top:3px;opacity:0.85"></div>`;
        }
        return `<div class="gantt-row">
            <div class="gantt-label">${m.name}</div>
            <div class="gantt-bars">
                <div class="gantt-bar planned" style="left:${leftPlanned};width:${widthPlanned}"></div>
                ${actualBar}
            </div>
        </div>`;
    }).join('');

    const milestoneRows = detail.milestones.map((m,i) => {
        const plannedStyle = 'color:#546e7a';
        let actualStartStyle = 'color:#999';
        let actualEndStyle = 'color:#999';
        if(m.as !== '—') {
            actualStartStyle = (m.rag==='red'||m.rag==='yellow') ? 'color:#c62828;font-weight:600' : 'color:#2e7d32;font-weight:600';
        }
        if(m.ae !== '—') {
            actualEndStyle = (m.rag==='red'||m.rag==='yellow') ? 'color:#c62828;font-weight:600' : 'color:#2e7d32;font-weight:600';
        }
        // Check if this milestone has linked dependencies
        const linkedDeps = (detail.dependencies||[]).filter(d => d.linkedMilestone && m.name.toLowerCase().includes(d.linkedMilestone.toLowerCase().split(' ')[0]));
        const depIndicator = linkedDeps.length > 0 ? 
            `<span style="margin-left:6px;background:${linkedDeps.some(d=>d.status==='Overdue')?'#ffebee':'#e3f2fd'};color:${linkedDeps.some(d=>d.status==='Overdue')?'#c62828':'#1565c0'};padding:1px 6px;border-radius:8px;font-size:10px;cursor:pointer" title="${linkedDeps.map(d=>d.name+' ('+d.status+')').join(', ')}">🔗 ${linkedDeps.length}</span>` : '';
        return `<tr class="no-hover">
        <td>${i+1}</td><td>${m.name}${depIndicator}</td><td>${m.vendor}</td>
        <td style="${plannedStyle}">${m.ps}</td><td style="${plannedStyle}">${m.pe}</td>
        <td style="${actualStartStyle}">${m.as}</td><td style="${actualEndStyle}">${m.ae}</td>
        <td><strong>${m.slip}</strong></td>
        <td>${ragBadge(m.rag)} <button class="btn-icon" onclick="openMilestoneRAG('${m.name}')" title="Update milestone RAG">🔄</button></td>
    </tr>`;
    }).join('');

    // Slippage summary row
    const slippageSummaryRow = `<tr class="no-hover" style="background:#f0f2ff;font-weight:600;border-top:2px solid #1a237e">
        <td></td><td style="color:#1a237e">TOTAL</td><td></td>
        <td style="color:#546e7a" colspan="2">1 Jul → 20 Sep (82 days)</td>
        <td colspan="2"></td>
        <td style="color:#c62828">+13 days</td>
        <td></td>
    </tr>
    <tr class="no-hover" style="background:#fafafa">
        <td colspan="9" style="padding:12px">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                <span style="font-size:12px;font-weight:600;color:#1a237e">📅 Revised Target Date:</span>
                <span style="font-size:12px;color:#666">Original: <strong>20 Sep</strong></span>
                <span style="font-size:12px;color:#666">|</span>
                <span style="font-size:12px;color:#2e7d32;font-weight:600">Revised: 15 Sep (Fast-track: 5 days recovered)</span>
                <button class="btn-icon" title="Edit revised target date" style="margin-left:4px">✏️</button>
            </div>
        </td>
    </tr>`;

    const deps = detail.dependencies || [];
    const depRows = deps.map((d,i) => {
        const isOverdue = d.status === 'Overdue';
        const rowClass = isOverdue ? 'overdue no-hover' : 'no-hover';
        const statusBadge = d.status === 'Resolved' ? '<span class="status-badge resolved">✓ Resolved</span>' :
                           d.status === 'WIP' ? '<span class="status-badge wip">● WIP</span>' :
                           '<span class="status-badge overdue">⚠️ Overdue</span>';
        const action = isOverdue ? '<button class="btn btn-danger btn-sm" onclick="alert(\'Escalation sent to leadership\')">Escalate</button>' :
                      d.status === 'Resolved' ? '✓' : '—';
        return `<tr class="${rowClass}">
            <td>${d.name}</td>
            <td>${d.owner}</td>
            <td>${d.cutoff}</td>
            <td>${d.raisedOn}</td>
            <td>${statusBadge}</td>
            <td>${d.linkedMilestone}</td>
            <td>${action}</td>
        </tr>`;
    }).join('');

    return `
    <div class="breadcrumb">
        <a onclick="navigateTo('dashboard')">Dashboard</a><span class="sep">›</span>
        <a onclick="navigateTo('mpList')">MPs</a><span class="sep">›</span>
        <a onclick="navigateTo('cpList')">${selectedMP?selectedMP.code:'B1'}</a><span class="sep">›</span>
        <a onclick="navigateTo('projectList')">${selectedCP?selectedCP.code:'B1.1'}</a><span class="sep">›</span>
        <span>${p.name}</span>
    </div>
    <div class="project-header">
        <div class="left">
            <span class="title">${p.name}</span>
            ${ragBadge(p.rag)}
        </div>
        <button class="btn btn-primary" onclick="openModal()">🔄 Update RAG</button>
    </div>
    <div class="info-pills">
        <span class="info-pill"><strong>Type:</strong> <span class="type-badge ${typeBadgeClass(p.type)}">${p.type.replace('_',' ')}</span></span>
        <span class="info-pill"><strong>Vendor:</strong> ${detail.vendor}</span>
        <span class="info-pill"><strong>PO:</strong> ${detail.po}</span>
        <span class="info-pill"><strong>LoB:</strong> ${detail.lob}</span>
    </div>
    <div class="tab-bar">
        <div class="tab-item ${currentTab==='process'?'active':''}" onclick="switchTab('process')">Process Track</div>
        <div class="tab-item ${currentTab==='execution'?'active':''}" onclick="switchTab('execution')">Execution Track</div>
        <div class="tab-item ${currentTab==='dependencies'?'active':''}" onclick="switchTab('dependencies')">Dependencies</div>
        <div class="tab-item ${currentTab==='budget'?'active':''}" onclick="switchTab('budget')">Budget</div>
    </div>
    <div id="tab-process" style="display:${currentTab==='process'?'block':'none'}">
        <div class="card">
            <h3>Process Stage Progress</h3>
            <p class="subtitle">Current Stage: <strong>${detail.stages[detail.stageStatus.indexOf('current')]}</strong></p>
            <div class="stepper-track">${stepperHTML}</div>
        </div>
    </div>
    <div id="tab-execution" style="display:${currentTab==='execution'?'block':'none'}">
        <div class="card">
            <h3>Gantt Timeline</h3>
            <p class="subtitle">Jul 2026 - Oct 2026 &nbsp;|&nbsp; Bars color-coded by milestone RAG</p>
            <div class="gantt-container">
                <div class="gantt-chart">
                    <div class="gantt-header">
                        <div class="gantt-month">Jul</div><div class="gantt-month">Aug</div>
                        <div class="gantt-month">Sep</div><div class="gantt-month">Oct</div>
                    </div>
                    ${ganttBars}
                </div>
            </div>
            <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:#666">
                <span><span style="display:inline-block;width:12px;height:12px;background:#bbdefb;border-radius:2px;vertical-align:middle"></span> Planned</span>
                <span><span style="display:inline-block;width:12px;height:12px;background:#66bb6a;border-radius:2px;vertical-align:middle"></span> Green</span>
                <span><span style="display:inline-block;width:12px;height:12px;background:#ffc107;border-radius:2px;vertical-align:middle"></span> Yellow</span>
                <span><span style="display:inline-block;width:12px;height:12px;background:#ef5350;border-radius:2px;vertical-align:middle"></span> Red</span>
            </div>
        </div>
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <h3>Milestone Details</h3>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-secondary btn-sm" onclick="alert('Downloads this project execution plan as Excel: milestones, dates, slippage, dependencies')">📥 Download Plan</button>
                    <button class="btn btn-secondary btn-sm" onclick="alert('Upload Excel/CSV with columns: Milestone Name, Vendor, Planned Start, Planned End')">📤 Bulk Import</button>
                    <button class="btn btn-primary btn-sm" onclick="alert('Add Milestone modal — fields: Name, Vendor, Planned Start, Planned End')">+ Add Milestone</button>
                </div>
            </div>
            <div style="background:#e8eaf6;border-radius:8px;padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;font-size:12px;color:#1a237e">
                <span>📊 <strong>Cumulative Slippage:</strong> +13 days</span>
                <span style="color:#999">|</span>
                <span><strong>Revised Target:</strong> 15 Sep 2026 (5 days fast-tracked)</span>
            </div>
            <div style="overflow-x:auto">
            <table class="data-table">
                <thead><tr><th>#</th><th>Milestone</th><th>Vendor</th><th>Planned Start</th><th>Planned End</th><th>Actual Start</th><th>Actual End</th><th>Slippage</th><th>RAG</th></tr></thead>
                <tbody>${milestoneRows}${slippageSummaryRow}</tbody>
            </table>
            </div>
        </div>
    </div>
    <div id="tab-dependencies" style="display:${currentTab==='dependencies'?'block':'none'}">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h3>Project Dependencies</h3>
                <button class="btn btn-primary btn-sm" onclick="alert('Add Dependency modal coming soon')">+ Add Dependency</button>
            </div>
            <p class="subtitle">Track external dependencies, blockers, and escalations for this project</p>
            <div style="overflow-x:auto">
            <table class="data-table">
                <thead><tr><th>Dependency</th><th>Owner</th><th>Cutoff Date</th><th>Raised On</th><th>Status</th><th>Linked Milestone</th><th>Actions</th></tr></thead>
                <tbody>${depRows}</tbody>
            </table>
            </div>
        </div>
    </div>
    <div id="tab-budget" style="display:${currentTab==='budget'?'block':'none'}">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h3>Budget Tracker</h3>
                <button class="btn btn-primary btn-sm" onclick="alert('Edit Budget modal — update amounts')">✏️ Edit Budget</button>
            </div>
            <div class="metrics-grid" style="grid-template-columns:repeat(5,1fr)">
                <div class="metric-card"><h4>Internal Estimate</h4><div class="value" style="font-size:18px">₹18.5L</div><div class="sub">TVS team estimate</div></div>
                <div class="metric-card"><h4>Approved Budget</h4><div class="value" style="font-size:18px">₹22.0L</div><div class="sub">Sanctioned amount</div></div>
                <div class="metric-card"><h4>Vendor Proposal</h4><div class="value" style="font-size:18px">₹24.5L</div><div class="sub">SOW cost</div></div>
                <div class="metric-card yellow"><h4>Exhausted</h4><div class="value" style="font-size:18px">₹17.8L</div><div class="sub">81% utilized</div></div>
                <div class="metric-card green"><h4>Remaining</h4><div class="value" style="font-size:18px">₹4.2L</div><div class="sub">19% left</div></div>
            </div>
            <div style="margin-top:16px">
                <div style="display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:4px">
                    <span>Budget Utilization</span>
                    <span style="font-weight:600;color:#f57f17">81% (At Risk)</span>
                </div>
                <div style="height:10px;background:#e0e0e0;border-radius:5px;overflow:hidden">
                    <div style="height:100%;width:81%;background:linear-gradient(90deg,#4caf50 0%,#4caf50 60%,#ffc107 80%,#ffc107 100%);border-radius:5px"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#999;margin-top:4px">
                    <span>₹0</span>
                    <span style="color:#f57f17">80% threshold</span>
                    <span>₹22.0L</span>
                </div>
            </div>
            <div style="margin-top:20px">
                <h4 style="font-size:12px;color:#1a237e;margin-bottom:8px">Variance Analysis</h4>
                <table class="data-table">
                    <thead><tr><th>Metric</th><th>Amount</th><th>Notes</th></tr></thead>
                    <tbody>
                        <tr class="no-hover"><td>Vendor vs Internal Estimate</td><td style="color:#c62828;font-weight:600">+₹6.0L (+32%)</td><td>Vendor quoted higher than internal estimate</td></tr>
                        <tr class="no-hover"><td>Vendor vs Approved Budget</td><td style="color:#c62828;font-weight:600">+₹2.5L (+11%)</td><td>Over budget allocation — needs CR approval</td></tr>
                        <tr class="no-hover"><td>Burn Rate (avg/month)</td><td>₹5.9L/month</td><td>Based on 3 months of execution</td></tr>
                        <tr class="no-hover"><td>Projected Total Spend</td><td style="color:#f57f17;font-weight:600">₹23.6L</td><td>At current burn rate — 7% over budget</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>`;
}

function switchTab(tab) {
    currentTab = tab;
    const processEl = document.getElementById('tab-process');
    const executionEl = document.getElementById('tab-execution');
    const depsEl = document.getElementById('tab-dependencies');
    const budgetEl = document.getElementById('tab-budget');
    if(processEl) processEl.style.display = tab==='process' ? 'block' : 'none';
    if(executionEl) executionEl.style.display = tab==='execution' ? 'block' : 'none';
    if(depsEl) depsEl.style.display = tab==='dependencies' ? 'block' : 'none';
    if(budgetEl) budgetEl.style.display = tab==='budget' ? 'block' : 'none';
    document.querySelectorAll('.tab-item').forEach((t,i) => {
        t.classList.remove('active');
        if((tab==='process' && i===0) || (tab==='execution' && i===1) || (tab==='dependencies' && i===2) || (tab==='budget' && i===3)) {
            t.classList.add('active');
        }
    });
}

// ==================== NAVIGATION ====================
function navigateTo(view) {
    currentView = view;
    currentTab = 'process';
    render();
}

// ==================== MODAL ====================
function openModal() {
    document.getElementById('ragModalTitle').textContent = 'Update Project RAG Status';
    document.getElementById('ragModal').classList.add('show');
}

function openMilestoneRAG(milestoneName) {
    document.getElementById('ragModalTitle').textContent = 'Update RAG: ' + milestoneName;
    document.getElementById('ragModal').classList.add('show');
}

function closeModal() {
    document.getElementById('ragModal').classList.remove('show');
    document.getElementById('condFields').classList.remove('show');
    document.querySelectorAll('input[name=rag]').forEach(r=>r.checked=false);
}

function closeModalOutside(e) {
    if(e.target===document.getElementById('ragModal')) closeModal();
}

function toggleConditional() {
    const val = document.querySelector('input[name=rag]:checked').value;
    const fields = document.getElementById('condFields');
    if(val==='yellow'||val==='red') { fields.classList.add('show'); }
    else { fields.classList.remove('show'); }
}

// ==================== BU SWITCHER ====================
function switchBU(btn, bu) {
    activeBU = bu;
    render();
}

// ==================== INIT ====================
render();
</script>
</body>
</html>

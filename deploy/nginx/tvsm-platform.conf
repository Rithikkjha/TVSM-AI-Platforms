# ---------------------------------------------------------------------------
# nginx reverse proxy — single hostname, path-based routing
#
#   https://smartbrain.tvsmotor.net/brain/chatbot   -> 127.0.0.1:8000  (SmartBrain UI)
#   https://smartbrain.tvsmotor.net/brain/mcp        -> 127.0.0.1:8000  (SmartBrain MCP)
#   https://smartbrain.tvsmotor.net/brain/v1/...     -> 127.0.0.1:8000  (SmartBrain REST API)
#   https://smartbrain.tvsmotor.net/planiq/          -> 127.0.0.1:9000  (PlanIQ / Estimation)
#
# Only one DNS name is issued (smartbrain.tvsmotor.net -> 10.44.59.200), so both
# apps are served under path prefixes on the same host. nginx strips the prefix
# (trailing slash on proxy_pass) and each app is started with a matching
# --root-path so generated links / docs stay correct:
#
#   SmartBrain : uvicorn api.app:app  --host 0.0.0.0 --port 8000 --root-path /brain
#   PlanIQ     : uvicorn main:app     --host 0.0.0.0 --port 9000 --root-path /planiq
#                (in the estimation-tool container, add --root-path /planiq to the CMD)
#
# TLS: wildcard cert *.tvsmotor.net from Key Vault (tvsmotor-net-wc), placed at
#   /etc/nginx/certs/tvsmotor-net-wc.crt  (full chain)
#   /etc/nginx/certs/tvsmotor-net-wc.key
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smartbrain.tvsmotor.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartbrain.tvsmotor.net;

    ssl_certificate     /etc/nginx/certs/tvsmotor-net-wc.crt;
    ssl_certificate_key /etc/nginx/certs/tvsmotor-net-wc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    # Land on the chatbot by default
    location = / {
        return 302 /brain/chatbot/;
    }

    # ----- SmartBrain (port 8000) under /brain -----
    location /brain/ {
        proxy_pass http://127.0.0.1:8000/;   # trailing slash strips the /brain prefix

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /brain;

        # Streaming-friendly for /brain/v1/ask and /brain/mcp (Streamable HTTP / SSE)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade    $http_upgrade;
    }

    # ----- PlanIQ API (port 9000) at root /api -----
    # The PlanIQ SPA hardcodes absolute /api/... calls, so they must be routed
    # to the estimation backend at root (SmartBrain never uses /api, so no clash).
    location /api/ {
        proxy_pass http://127.0.0.1:9000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ----- PlanIQ root-absolute assets (SPA references these with a leading /) -----
    # The MPCP module loads /mpcp-tracker.js and the app pings /health, both at root.
    # SmartBrain uses neither, so routing them to PlanIQ (:9000) is safe.
    location = /health {
        proxy_pass http://127.0.0.1:9000/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /mpcp-tracker.js {
        proxy_pass http://127.0.0.1:9000/mpcp-tracker.js;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- PlanIQ / Estimation Tool (port 9000) under /planiq -----
    location /planiq/ {
        proxy_pass http://127.0.0.1:9000/;   # trailing slash strips the /planiq prefix

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /planiq;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade    $http_upgrade;
    }
}

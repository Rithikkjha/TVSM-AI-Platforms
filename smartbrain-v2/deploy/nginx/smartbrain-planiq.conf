# ---------------------------------------------------------------------------
# nginx reverse proxy for the UAT VM (10.44.59.200)
#
#   smartbrain.tvsmotor.net  -> 127.0.0.1:8000  (SmartBrain API + /chatbot + /mcp)
#   planiq.tvsmotor.net      -> 127.0.0.1:9000  (Estimation Tool / PlanIQ)
#
# Both hostnames resolve to this VM via DNS A records; nginx routes by the
# Host header (name-based virtual hosting) and terminates TLS on 443.
#
# Install:
#   sudo cp smartbrain-planiq.conf /etc/nginx/sites-available/smartbrain-planiq.conf
#   sudo ln -s /etc/nginx/sites-available/smartbrain-planiq.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # remove the default site
#   sudo nginx -t                                      # test config
#   sudo systemctl reload nginx
#
# Certs (from Key Vault -> converted to PEM, see notes) are expected at:
#   /etc/nginx/certs/smartbrain.tvsmotor.net.crt  (full chain: server + intermediates)
#   /etc/nginx/certs/smartbrain.tvsmotor.net.key
#   /etc/nginx/certs/planiq.tvsmotor.net.crt
#   /etc/nginx/certs/planiq.tvsmotor.net.key
# ---------------------------------------------------------------------------

# Map for WebSocket/SSE Connection header (sites-enabled files are included
# inside the http{} context, so this map is valid here).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all plain HTTP to HTTPS for both hostnames
server {
    listen 80;
    listen [::]:80;
    server_name smartbrain.tvsmotor.net planiq.tvsmotor.net;
    return 301 https://$host$request_uri;
}

# ===========================================================================
# SmartBrain  ->  127.0.0.1:8000
# ===========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartbrain.tvsmotor.net;

    ssl_certificate     /etc/nginx/certs/tvsmotor-net-wc.crt;   # wildcard *.tvsmotor.net
    ssl_certificate_key /etc/nginx/certs/tvsmotor-net-wc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow large-ish request bodies (doc uploads, big questions)
    client_max_body_size 25m;

    # Optional: send users to the chatbot UI by default
    location = / {
        return 302 /chatbot/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-friendly: /v1/ask (long LLM calls) and /mcp (Streamable HTTP / SSE)
        proxy_buffering      off;
        proxy_cache          off;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        # WebSocket / SSE upgrade support
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;
    }
}

# ===========================================================================
# PlanIQ / Estimation Tool  ->  127.0.0.1:9000
# ===========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name planiq.tvsmotor.net;

    ssl_certificate     /etc/nginx/certs/tvsmotor-net-wc.crt;   # wildcard *.tvsmotor.net
    ssl_certificate_key /etc/nginx/certs/tvsmotor-net-wc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;   # estimation tool ingests BRD/PRD/HLD docs

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering      off;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;
    }
}

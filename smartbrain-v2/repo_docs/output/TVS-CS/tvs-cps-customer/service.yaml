flows:
- flow_id: tvs-cps-backend--tvs-cps-customer
  name: tvs-cps-backend → tvs-cps-customer (1 hop)
  role: consumer
  steps:
  - from: tvs-cps-backend
    to: tvs-cps-customer
    via: POST /api/v1/customer/add-vehicle (+6 more)
    data: APIResponse, AddVehicleRequest, CustomerCreateRequest, CustomerDeleteRequest, CustomerSearchRequest (+1 more)
    source: code
- flow_id: tvs-cps-jobs--tvs-cps-customer
  name: tvs-cps-jobs → tvs-cps-customer (2 hops)
  role: consumer
  steps:
  - from: tvs-cps-jobs
    to: tvs-cps-backend
    via: POST /system/api/v1/analytic/booking/stats (+3 more)
    data: APIResponse<map<string,object>>, AnalyticsDto, AnalyticsRequestDTO
    source: code
  - from: tvs-cps-backend
    to: tvs-cps-customer
    via: POST /api/v1/customer/add-vehicle (+6 more)
    data: APIResponse, AddVehicleRequest, CustomerCreateRequest, CustomerDeleteRequest, CustomerSearchRequest (+1 more)
    source: code
- flow_id: tvs-cps-portal--tvs-cps-customer
  name: tvs-cps-portal → tvs-cps-customer (2 hops)
  role: consumer
  steps:
  - from: tvs-cps-portal
    to: tvs-cps-backend
    via: GET /api/v1/announcement/get/{announcementId} (+128 more)
    data: APIResponse<AnnouncementResponseDto>, APIResponse<AnnouncementResponseDto[]>, APIResponse<AppointmentCountResponseDTO>,
      APIResponse<AppointmentDashboardResponseDTO>, APIResponse<AppointmentDetailResponseDTO> (+105 more)
    source: code
  - from: tvs-cps-backend
    to: tvs-cps-customer
    via: POST /api/v1/customer/add-vehicle (+6 more)
    data: APIResponse, AddVehicleRequest, CustomerCreateRequest, CustomerDeleteRequest, CustomerSearchRequest (+1 more)
    source: code

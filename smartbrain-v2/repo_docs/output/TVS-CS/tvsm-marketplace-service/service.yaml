flows:
- flow_id: tvsm-marketplace-service--external-juspay
  name: tvsm-marketplace-service → external:juspay (2 hops)
  role: orchestrator
  steps:
  - from: tvsm-marketplace-service
    to: booking-crud-services
    via: POST /bookings (+3 more)
    data: BookingResponseDto, BookingRetrievalRequestDto, BookingRetrievalResponseDto, CancelBookingRequestDto, CancellationResponseDto
      (+2 more)
    source: code
  - from: booking-crud-services
    to: external:juspay
    via: sdk-symbol:JusPayFnFRefundStatus
    data: null
    source: code
- flow_id: tvsm-marketplace-service--external-salesforce-0499bb
  name: tvsm-marketplace-service → external:salesforce (4 hops)
  role: orchestrator
  steps:
  - from: tvsm-marketplace-service
    to: master-data-platform
    via: GET /mdp/v1/dealer/{sapDealerCode} (+2 more)
    data: GeneralResponse, ProximityRequest
    source: code
  - from: master-data-platform
    to: tvsmbe-mdp-bff
    via: topic:mdp.dealer_data
    data: DealerData
    source: code
  - from: tvsmbe-mdp-bff
    to: notification-service
    via: POST /api/v1/notification/email
    data: EmailNotification, NotificationResponse
    source: code
  - from: notification-service
    to: external:salesforce
    via: sdk-symbol:SalesforceBlobConfig
    data: null
    source: code
- flow_id: tvsm-marketplace-service--external-salesforce-18fcb0
  name: tvsm-marketplace-service → external:salesforce (3 hops)
  role: orchestrator
  steps:
  - from: tvsm-marketplace-service
    to: notification-service
    via: POST /api/v1/notification/email
    data: EmailNotification, NotificationResponse
    source: code
  - from: notification-service
    to: notification-dispatcher-service
    via: topic:notifications
    data: null
    source: code
  - from: notification-dispatcher-service
    to: external:salesforce
    via: sdk-symbol:SalesforceAuthGen
    data: null
    source: code
- flow_id: tvsm-marketplace-service--external-salesforce-1dcb9e
  name: tvsm-marketplace-service → external:salesforce (5 hops)
  role: orchestrator
  steps:
  - from: tvsm-marketplace-service
    to: lms
    via: POST /api/lead (+1 more)
    data: LeadRequestModel, LeadsFilterRequestForSingleLead
    source: code
  - from: lms
    to: lms-ems
    via: topic:lead
    data: null
    source: code
  - from: lms-ems
    to: lms-process
    via: topic:lead
    data: null

# Docker Compose development environment for engineering-memory-graph.
# Brings up:
#   - neo4j   (graph store, bolt://7687, browser http://localhost:7474)
#   - qdrant  (local vector store substitute for Azure AI Search, :6333)
#   - api     (FastAPI app with uvicorn --reload, :8000)
#
# Data is persisted under ./data/ (gitignored) so restarts preserve state.

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: emg2-neo4j
    ports:
      - "7475:7474"   # HTTP browser (host 7475 to avoid clashing with v1)
      - "7688:7687"   # Bolt (host 7688 to avoid clashing with v1)
    environment:
      # Auth: NEO4J_AUTH is the only auth env var Neo4j 5.x recognizes.
      NEO4J_AUTH: "neo4j/neo4jpassword"
      # Enable APOC plugin (skip GDS for now — it's large and not needed for V1).
      NEO4J_PLUGINS: '["apoc"]'
      # Neo4j 5.x config uses server.* namespace (not dbms.*).
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: emg2-qdrant
    ports:
      - "6335:6333"   # REST (host 6335 to avoid clashing with v1)
      - "6336:6334"   # gRPC (host 6336 to avoid clashing with v1)
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # Qdrant exposes a readyz endpoint; bash+/dev/tcp avoids needing curl.
      test:
        - "CMD-SHELL"
        - "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: emg2-api
    command:
      - "uvicorn"
      - "api.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
    ports:
      - "8001:8000"   # host 8001 to avoid clashing with v1
    environment:
      # Neo4j — override NEO4J_URI from .env so the container targets the
      # docker-compose service hostname regardless of host-side defaults.
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4jpassword}"
      # Vector store (dev uses Qdrant).
      QDRANT_URL: "http://qdrant:6333"
      # Azure / integrations / app config flow through from .env.
      AZURE_OPENAI_KEY: "${AZURE_OPENAI_KEY:-}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_DEPLOYMENT_GPT4O: "${AZURE_OPENAI_DEPLOYMENT_GPT4O:-gpt-4o}"
      AZURE_OPENAI_DEPLOYMENT_EMBEDDING: "${AZURE_OPENAI_DEPLOYMENT_EMBEDDING:-text-embedding-3-large}"
      AZURE_SEARCH_ENDPOINT: "${AZURE_SEARCH_ENDPOINT:-}"
      AZURE_SEARCH_KEY: "${AZURE_SEARCH_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      JIRA_TOKEN: "${JIRA_TOKEN:-}"
      JIRA_EMAIL: "${JIRA_EMAIL:-}"
      JIRA_URL: "${JIRA_URL:-}"
      CONFLUENCE_TOKEN: "${CONFLUENCE_TOKEN:-}"
      CONFLUENCE_URL: "${CONFLUENCE_URL:-}"
      API_KEY: "${API_KEY:-dev-api-key}"
      MCP_SERVERS_CONFIG_PATH: "${MCP_SERVERS_CONFIG_PATH:-/app/config/mcp_servers.yaml}"
    volumes:
      # Bind-mount the reorganized package tree so uvicorn --reload picks up edits.
      - ./config:/app/config
      - ./storage:/app/storage
      - ./processing:/app/processing
      - ./ingestion:/app/ingestion
      - ./retrieval:/app/retrieval
      - ./api:/app/api
      - ./mcp_server:/app/mcp_server
      - ./analysis:/app/analysis
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./ui:/app/ui:ro
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

# Named volumes are intentionally avoided; bind mounts under ./data/ make it
# easy to inspect or wipe state from the host (./data/ is gitignored).

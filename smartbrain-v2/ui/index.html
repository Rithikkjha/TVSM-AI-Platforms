<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Memory Graph</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <div class="app">
        <!-- Mobile toggle -->
        <button class="mobile-toggle" id="mobileToggle">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    New Chat
                </button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-tab active" id="chatTab">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M2 3a1 1 0 011-1h10a1 1 0 011 1v8a1 1 0 01-1 1H5l-3 3V3z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    Chat
                </button>
                <button class="nav-tab" id="searchTab">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Search
                </button>
            </nav>
            <div class="conversation-list" id="conversationList"></div>
            <div class="sidebar-footer">
                <!-- Login state: who's signed in + sign out, or a sign in button -->
                <div class="account-box" id="accountBox">
                    <div class="account-user" id="accountUser" style="display:none;">
                        <span class="account-name" id="accountName"></span>
                        <span class="account-email" id="accountEmail"></span>
                        <a class="account-link" id="signOutLink" href="#">Sign out</a>
                    </div>
                    <a class="account-link account-signin" id="signInLink" href="#" style="display:none;">Sign in</a>
                </div>
                <button class="settings-btn theme-toggle" id="themeToggle" title="Toggle light / dark mode">
                    <svg class="icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <svg class="icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none">
                        <path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 107 7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <span class="theme-label">Dark mode</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Chat View -->
            <div class="view active" id="chatView">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">
                            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                                <defs>
                                    <linearGradient id="brainGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#10b981"/>
                                        <stop offset="1" stop-color="#059669"/>
                                    </linearGradient>
                                </defs>
                                <rect width="56" height="56" rx="14" fill="url(#brainGrad)"/>
                                <circle cx="20" cy="22" r="3" fill="white"/>
                                <circle cx="36" cy="20" r="3" fill="white"/>
                                <circle cx="28" cy="36" r="3" fill="white"/>
                                <path d="M20 22L36 20M36 20L28 36M28 36L20 22" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
                            </svg>
                        </div>
                        <h1>SmartBrain</h1>
                        <p>Ask about your engineering systems — services, APIs, dependencies, data flows, and the knowledge behind them.</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <div class="input-container">
                        <textarea id="chatInput" placeholder="Ask about your engineering systems..." rows="1"></textarea>
                        <button class="send-btn" id="sendBtn" disabled>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M2 8l12-6-4 6 4 6L2 8z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Search View -->
            <div class="view" id="searchView">
                <div class="search-container">
                    <div class="search-header">
                        <h2>Search Services</h2>
                        <div class="search-input-wrapper">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Search services by name or alias...">
                        </div>
                    </div>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <!-- Service Detail View -->
            <div class="view" id="serviceDetailView">
                <div class="service-detail-container">
                    <button class="back-btn" id="backToSearch">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Back to search
                    </button>
                    <div class="service-detail-content" id="serviceDetailContent"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Login screen: shown when the user has no session -->
    <div class="login-overlay" id="loginOverlay" style="display:none;">
        <div class="login-card">
            <div class="login-logo">
                <svg width="64" height="64" viewBox="0 0 56 56" fill="none">
                    <defs>
                        <linearGradient id="loginGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#10b981"/>
                            <stop offset="1" stop-color="#059669"/>
                        </linearGradient>
                    </defs>
                    <rect width="56" height="56" rx="14" fill="url(#loginGrad)"/>
                    <circle cx="20" cy="22" r="3" fill="white"/>
                    <circle cx="36" cy="20" r="3" fill="white"/>
                    <circle cx="28" cy="36" r="3" fill="white"/>
                    <path d="M20 22L36 20M36 20L28 36M28 36L20 22" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
                </svg>
            </div>
            <h1>SmartBrain</h1>
            <p>Sign in with your TVS account to ask about your engineering systems.</p>
            <button class="login-btn" id="loginBtn">
                <svg width="18" height="18" viewBox="0 0 21 21" fill="none" aria-hidden="true">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft
            </button>
        </div>
    </div>

    <script src="markdown.js?v=7"></script>
    <script src="api.js?v=7"></script>
    <script src="app.js?v=7"></script>
</body>
</html>

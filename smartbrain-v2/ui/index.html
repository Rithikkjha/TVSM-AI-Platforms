<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Memory Graph</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Mobile toggle -->
        <button class="mobile-toggle" id="mobileToggle">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    New Chat
                </button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-tab active" id="chatTab">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M2 3a1 1 0 011-1h10a1 1 0 011 1v8a1 1 0 01-1 1H5l-3 3V3z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    Chat
                </button>
                <button class="nav-tab" id="searchTab">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Search
                </button>
            </nav>
            <div class="conversation-list" id="conversationList"></div>
            <div class="sidebar-footer">
                <button class="settings-btn" id="settingsBtn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Chat View -->
            <div class="view active" id="chatView">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                                <rect width="40" height="40" rx="8" fill="#10a37f"/>
                                <path d="M12 20l4 4 12-12" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h1>Engineering Memory Graph</h1>
                        <p>Ask questions about your engineering knowledge base, services, dependencies, and architecture.</p>
                        <div class="welcome-suggestions">
                            <button class="suggestion-chip" data-question="What services are in the graph?">What services are in the graph?</button>
                            <button class="suggestion-chip" data-question="Show me the dependencies of the notification service">Show dependencies of notification service</button>
                            <button class="suggestion-chip" data-question="What teams own the most services?">What teams own the most services?</button>
                            <button class="suggestion-chip" data-question="Find all services using Kafka">Find all services using Kafka</button>
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <div class="input-container">
                        <textarea id="chatInput" placeholder="Ask about your engineering systems..." rows="1"></textarea>
                        <button class="send-btn" id="sendBtn" disabled>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M2 8l12-6-4 6 4 6L2 8z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Search View -->
            <div class="view" id="searchView">
                <div class="search-container">
                    <div class="search-header">
                        <h2>Search Services & Entities</h2>
                        <div class="search-input-wrapper">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Search for services, teams, repos...">
                        </div>
                    </div>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <!-- Service Detail View -->
            <div class="view" id="serviceDetailView">
                <div class="service-detail-container">
                    <button class="back-btn" id="backToSearch">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Back to search
                    </button>
                    <div class="service-detail-content" id="serviceDetailContent"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="modal-close" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="apiKeyInput">API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="Enter your API key">
                    <div class="form-hint">Used in the X-API-Key header for authenticated endpoints.</div>
                </div>
                <div class="form-group">
                    <label for="apiBaseUrl">API Base URL</label>
                    <input type="text" id="apiBaseUrl" placeholder="/ (default, same origin)">
                    <div class="form-hint">Leave empty or "/" to use the same origin as the UI.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
                <button class="btn btn-primary" id="saveSettings">Save</button>
            </div>
        </div>
    </div>

    <script src="markdown.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
